name: Deploy

# Builds and deploys the app to the VPS that serves
# https://settiva.expekerja.com. Remote work happens in scripts/deploy.sh,
# invoked through a forced SSH command bound to DEPLOY_SSH_KEY.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-settiva
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      # The remote key is locked to the deploy script, so the argument is ignored.
      - name: Pull, rebuild and restart on the VPS
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" deploy

      # Skips cleanly while the DNS record has not been created yet, so pushes
      # do not fail on infrastructure that is not in place.
      - name: Verify the public site
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -uo pipefail
          resolved="$(getent ahostsv4 settiva.expekerja.com | awk 'NR==1{print $1}')"
          if [ -z "$resolved" ]; then
            echo "::notice::settiva.expekerja.com does not resolve yet — skipping public verification"
            exit 0
          fi
          if [ "$resolved" != "$DEPLOY_HOST" ]; then
            echo "::notice::settiva.expekerja.com resolves to $resolved (not $DEPLOY_HOST) — skipping public verification"
            exit 0
          fi
          for i in {1..15}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://settiva.expekerja.com/ || true)
            [ "$code" = "200" ] && { echo "https://settiva.expekerja.com -> 200"; exit 0; }
            sleep 3
          done
          echo "::error::https://settiva.expekerja.com did not return 200 after deploy (last: $code)"
          exit 1
